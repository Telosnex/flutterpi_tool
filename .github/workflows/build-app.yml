name: Build Test App

on:
  push:
    branches: ["telosnex/flutter-3.50"]
  pull_request:
    branches: ["telosnex/flutter-3.50"]

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter-Pi Bundle (${{ matrix.arch }}, ${{ matrix.cpu}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - arm
          - arm64
          - x64
          - riscv64
        cpu:
          - generic
        include:
          - arch: arm
            cpu: pi3
          - arch: arm
            cpu: pi4
          - arch: arm64
            cpu: pi3
          - arch: arm64
            cpu: pi4
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable
          flutter-version: 3.50.0

      - name: Install locked dependencies
        run: |
          dart tool/link_sdk.dart
          dart pub get --enforce-lockfile

      - name: Create test app
        run: flutter create test_app

      - name: Run flutterpi_tool build
        working-directory: test_app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo '::group::flutterpi_tool build ... --debug-unoptimized'
          dart --packages=../.dart_tool/package_config.json ../bin/flutterpi_tool.dart build --arch=${{ matrix.arch }} --cpu=${{ matrix.cpu }} --debug-unoptimized --debug-symbols --verbose
          echo '::endgroup::'

          echo '::group::flutterpi_tool build ... --debug'
          dart --packages=../.dart_tool/package_config.json ../bin/flutterpi_tool.dart build --arch=${{ matrix.arch }} --cpu=${{ matrix.cpu }} --debug --debug-symbols --verbose
          echo '::endgroup::'

          echo '::group::flutterpi_tool build ... --profile'
          dart --packages=../.dart_tool/package_config.json ../bin/flutterpi_tool.dart build --arch=${{ matrix.arch }} --cpu=${{ matrix.cpu }} --profile --debug-symbols --verbose
          echo '::endgroup::'

          echo '::group::flutterpi_tool build ... --release'
          dart --packages=../.dart_tool/package_config.json ../bin/flutterpi_tool.dart build --arch=${{ matrix.arch }} --cpu=${{ matrix.cpu }} --release --debug-symbols --verbose
          echo '::endgroup::'
